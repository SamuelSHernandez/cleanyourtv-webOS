<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=1920, height=1080">
<title>CYTV Home</title>
<link rel="stylesheet" href="css/launcher.css">
</head>
<body>
<div id="backdrop" class="backdrop" aria-hidden="true">
  <div id="sky" hidden></div>
  <img id="wallpaper" alt="" hidden>
  <div id="wallpaper-dim" hidden></div>
</div>
<main id="root" aria-label="Home">
  <header class="top">
    <div id="when" class="when">
      <div id="greeting" class="greeting"></div>
      <div class="clockline"><span id="clock" class="clock"></span><span id="date" class="date"></span></div>
      <div id="shamsi" class="altdate" hidden></div>
      <div id="lunar" class="altdate" hidden></div>
    </div>
    <nav id="topbar" class="topbar" aria-label="TV"></nav>
  </header>
  <div id="caption" class="caption" hidden></div>
  <div id="spacer"></div>
  <h1 id="dock-title" class="dock-title"></h1>
  <section id="home" class="home" aria-label="Apps"></section>
  <p id="notice" class="notice" role="status" hidden></p>
</main>
<div id="menu" class="menu" role="dialog" aria-modal="true" hidden>
  <h2 id="menu-title" class="menu-title"></h2>
  <p id="menu-hint" class="menu-hint"></p>
  <div id="menu-items" class="menu-items"></div>
</div>
<div id="screensaver" class="screensaver" hidden>
  <img id="ss-wallpaper" class="ss-wallpaper" alt="" hidden>
  <div id="ss-dim" class="ss-dim" hidden></div>
  <div id="ss-glow" class="glow" hidden></div>
  <div id="ss-time" class="ss-time"></div>
</div>
<script src="js/i18n.js"></script>
<script src="js/strings.js"></script>
<script src="js/config.js"></script>
<script src="js/nav.js"></script>
<script src="js/prefs.js"></script>
<script src="js/model.js"></script>
<script src="js/keys.js"></script>
<script src="js/refresh.js"></script>
<script src="js/clock.js"></script>
<script src="js/wallpaper.js"></script>
<script src="js/cards.js"></script>
<script src="js/inventory.js"></script>
<script src="js/theme.js"></script>
<script src="js/adapter-webos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
