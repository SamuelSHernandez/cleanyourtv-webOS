# Tests for the webOS edition. Written for the layout after `git subtree split --prefix=webos`: the repository
# root is what is now webos/. No secrets, no publishing, no release builds: it only tests.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Python tests (fake TV, fake ares-*)
        run: python3 -m unittest discover -s tests -t tests -v
      - name: Launcher tests (node --test, fake DOM and platform)
        run: node --test 'tests/js/*.test.js'
      - name: Generated docs are current
        run: python3 scripts/gen_docs.py --check
      - name: The package builds and is repeatable
        run: |
          ./cytv-webos build | tee first.txt
          ./cytv-webos build | tee second.txt
          diff <(grep sha256 first.txt) <(grep sha256 second.txt)
